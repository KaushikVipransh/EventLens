services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: eventlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventlens}
      POSTGRES_DB: ${POSTGRES_DB:-eventlens}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-eventlens} -d ${POSTGRES_DB:-eventlens}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: eventlens-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: ['redis-server', '--maxmemory-policy', 'noeviction', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: eventlens-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: ['server', '/data', '--console-address', ':9001']
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  face:
    build:
      context: ./services/face
    container_name: eventlens-face
    restart: unless-stopped
    environment:
      FACE_MODEL: ${FACE_MODEL:-buffalo_l}
      FACE_DET_SIZE: ${FACE_DET_SIZE:-640}
    ports:
      - '${FACE_PORT:-8000}:8000'
    volumes:
      - facemodels:/root/.insightface
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 240s

volumes:
  pgdata:
  redisdata:
  miniodata:
  facemodels:
